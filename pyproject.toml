[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bolcut"
version = "0.1.0"
description = "Edit your video by editing the transcript. Hinglish-first, 100% local, free."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["video-editing", "transcript", "whisper", "ffmpeg", "hindi", "hinglish", "podcast", "descript-alternative", "open-source"]
authors = [{ name = "Chirag Solanki", email = "chirag120670598@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]

# The core engine has ZERO dependencies on purpose. Everything heavy is opt-in.
dependencies = []

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0.0"]
dev = ["pytest>=7.4.0"]

[project.urls]
Homepage = "https://github.com/chirag120670598-dotcom/bolcut"
Issues = "https://github.com/chirag120670598-dotcom/bolcut/issues"

[project.scripts]
bolcut = "bolcut.cli:main"

[tool.setuptools.packages.find]
include = ["bolcut*"]
